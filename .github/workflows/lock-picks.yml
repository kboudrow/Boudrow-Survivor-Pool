name: Lock survivor picks

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: lock-survivor-picks
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call pick locking endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set for this repository."
            exit 1
          fi

          curl --fail --show-error --silent \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://www.survivesunday.com/api/cron/lock-picks
